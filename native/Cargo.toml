[package]
name = "mbi_native"
version = "0.1.0"
edition = "2021"
description = "Native (Rust) kernels for mbi: junction-tree inference and mirror descent without JIT compilation"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

# No external dependencies: the library exposes a C ABI that Python loads with
# ctypes, so it builds offline with just a Rust toolchain.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
